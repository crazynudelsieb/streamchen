[pytest]
# The repo root on sys.path, so `import app` and `from tests.conftest import`
# resolve. Without it only `python -m pytest` works (that form adds the CWD
# itself); the bare `pytest` console script CI runs does not, and fails at
# conftest import.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::starlette.exceptions.StarletteDeprecationWarning
