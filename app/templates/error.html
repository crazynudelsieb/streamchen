{% extends "base.html" %}

{% block title %}{{ heading }} — {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card mx-auto" style="max-width: 520px">
        <div class="card-body text-center">
            <div class="feature-icon mx-auto"><i class="bi {{ icon }}"></i></div>
            <h1 class="h4 fw-bold">{{ heading }}</h1>
            <p class="text-muted">{{ message }}</p>
            <a class="btn btn-primary" href="/">{{ action or 'Back to the start' }}</a>
        </div>
    </div>
</div>
{% endblock %}
