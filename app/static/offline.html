<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#16a34a">
    <meta name="robots" content="noindex, nofollow">
    <title>Offline — streamchen</title>
    <!-- Standalone on purpose: this page is served by the service worker when
         the network is gone, so it cannot depend on fetching anything. -->
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            text-align: center;
            padding: 2rem 1.5rem;
        }
        .box { max-width: 26rem; }
        h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; margin: 1.5rem 0 .75rem; }
        p { color: #94a3b8; line-height: 1.6; margin: 0 0 1.75rem; }
        button {
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: #16a34a;
            border: none;
            border-radius: 10px;
            padding: .8rem 2rem;
            cursor: pointer;
        }
        button:hover { background: #15803d; }
        svg { width: 72px; height: 72px; }
    </style>
</head>
<body>
    <div class="box">
        <svg viewBox="0 0 64 64" role="img" aria-label="streamchen">
            <rect width="64" height="64" rx="14" fill="#1e293b"/>
            <g fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round">
                <path d="M14 32v-2a18 18 0 0 1 36 0v2"/>
                <path d="M16 34v10"/>
                <path d="M48 34v10"/>
            </g>
            <g fill="#16a34a">
                <rect x="24" y="28" width="4" height="12" rx="2"/>
                <rect x="30" y="22" width="4" height="24" rx="2"/>
                <rect x="36" y="30" width="4" height="8" rx="2"/>
            </g>
        </svg>
        <h1>No connection</h1>
        <p>
            streamchen is live radio, so there is nothing to listen to offline.
            The room is still there — try again once you are back.
        </p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
