name: CI

# Every push and pull request. The release workflow runs the same checks
# itself before it builds, so an image can never be published from a tree that
# does not lint and pass its tests.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call: # reused by build-multiarch.yml as its gate

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the interpreter in both Dockerfiles. Unlike a library, this
          # app ships on exactly one runtime, so the checks run on that one.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # No services: the suite runs on SQLite and fakeredis.
      - name: Test
        run: pytest -q

  # The two scans below are advisory. A CVE is published on somebody else's
  # schedule, and it lands on this repository as a red build on a tree that has
  # not changed -- blocking a release on it means the fix for whatever *is*
  # broken cannot ship either. So the findings are reported and the build goes
  # on: `continue-on-error` is set per scan step, not per job, because the
  # docker builds in the scan job are real build validation and an image that
  # no longer builds must still break CI.
  dependency-audit:
    name: Dependency vulnerability scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      # Advisory: a finding is printed and flagged, and does not fail the run.
      - name: Audit dependencies
        continue-on-error: true
        run: python -m pip_audit -r requirements-dev.txt

  image-scan:
    name: Container image vulnerability scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build API image (local)
        run: docker build -t streamchen-ci-api:latest -f Dockerfile .

      - name: Build worker image (local)
        run: docker build -t streamchen-ci-worker:latest -f Dockerfile.worker .

      - name: Build Icecast image (local)
        run: docker build -t streamchen-ci-icecast:latest -f docker/icecast/Dockerfile docker/icecast

      # Advisory, all three. exit-code stays 1 on purpose: that is what makes a
      # finding visible as a flagged step in the run rather than a table nobody
      # reads to the bottom of. `continue-on-error` is what keeps it off the
      # build.
      - name: Scan API image
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: streamchen-ci-api:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan worker image
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: streamchen-ci-worker:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Scan Icecast image
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: streamchen-ci-icecast:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  compose:
    name: Compose files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Catches a typo in the deployment before someone finds it on a server.
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
        env:
          PUBLIC_HOST: streamchen.example.com
          BASE_URL: https://streamchen.example.com
          ICECAST_PUBLIC_URL: https://streamchen.example.com/stream
          POSTGRES_DB: streamchen
          POSTGRES_USER: streamchen
          POSTGRES_PASSWORD: ci
          ICECAST_SOURCE_PASSWORD: ci
          ICECAST_ADMIN_PASSWORD: ci

      - name: Validate docker-compose.local.yml
        run: docker compose -f docker-compose.local.yml config --quiet
