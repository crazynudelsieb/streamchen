name: CI

# Every push and pull request. The release workflow runs the same checks
# itself before it builds, so an image can never be published from a tree that
# does not lint and pass its tests.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call: # reused by build-multiarch.yml as its gate

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the interpreter in both Dockerfiles. Unlike a library, this
          # app ships on exactly one runtime, so the checks run on that one.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # No services: the suite runs on SQLite and fakeredis.
      - name: Test
        run: pytest -q

  # Security checks stay advisory to avoid blocking unrelated fixes when an
  # upstream CVE lands without changes in this repository.
  dependency-audit:
    name: Dependency vulnerability scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      # Advisory: a finding is printed and flagged, and does not fail the run.
      - name: Audit dependencies
        continue-on-error: true
        run: python -m pip_audit -r requirements-dev.txt

  dependency-review:
    name: Dependency review (GitHub native)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Built-in GitHub action that flags newly introduced vulnerable packages
      # in pull requests by comparing lock/manifest changes against advisories.
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  compose:
    name: Compose files parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Catches a typo in the deployment before someone finds it on a server.
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
        env:
          PUBLIC_HOST: streamchen.example.com
          BASE_URL: https://streamchen.example.com
          ICECAST_PUBLIC_URL: https://streamchen.example.com/stream
          POSTGRES_DB: streamchen
          POSTGRES_USER: streamchen
          POSTGRES_PASSWORD: ci
          ICECAST_SOURCE_PASSWORD: ci
          ICECAST_ADMIN_PASSWORD: ci

      - name: Validate docker-compose.local.yml
        run: docker compose -f docker-compose.local.yml config --quiet
