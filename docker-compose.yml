# Production deployment. Five services, one persistent volume (concept §15).
#
# Images come from GHCR; use docker-compose.local.yml to build from this tree.
# Traefik terminates TLS and routes /stream to Icecast, so there is no extra
# proxy in the path.

services:
  api:
    # Serves the pages, the JSON API, the WebSocket and the static assets.
    image: ghcr.io/crazynudelsieb/streamchen:latest
    networks:
      - traefik
      - streamchen_internal
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?connect_timeout=3
      - REDIS_URL=redis://redis:6379/0
      - BASE_URL=${BASE_URL}
      - APP_NAME=${APP_NAME:-streamchen}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-1}
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD}
      - ICECAST_PUBLIC_URL=${ICECAST_PUBLIC_URL}
      - MAX_LISTENERS=${MAX_LISTENERS:-100}
      - MAX_PENDING_PER_LISTENER=${MAX_PENDING_PER_LISTENER:-3}
      - MAX_TRACK_DURATION_S=${MAX_TRACK_DURATION_S:-900}
      - ROOM_IDLE_DAYS=${ROOM_IDLE_DAYS:-7}
      - ADD_RATE_LIMIT=${ADD_RATE_LIMIT:-1}
      - ADD_RATE_WINDOW_S=${ADD_RATE_WINDOW_S:-15}
      - VOTE_RATE_LIMIT=${VOTE_RATE_LIMIT:-5}
      - VOTE_RATE_WINDOW_S=${VOTE_RATE_WINDOW_S:-10}
      - SHADOW_BAN_MINUTES=${SHADOW_BAN_MINUTES:-15}
      - SEO_ENABLED=${SEO_ENABLED:-false}
      - SEO_SITE_NAME=${SEO_SITE_NAME:-streamchen}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
      - CONTACT_MASTODON=${CONTACT_MASTODON:-}
      - CONTACT_GITHUB=${CONTACT_GITHUB:-}
      - CONTACT_KOFI=${CONTACT_KOFI:-}
      - CONTACT_BUYMEACOFFEE=${CONTACT_BUYMEACOFFEE:-}
      - IMPRINT_NAME=${IMPRINT_NAME:-}
      - IMPRINT_ADDRESS=${IMPRINT_ADDRESS:-}
      - IMPRINT_EMAIL=${IMPRINT_EMAIL:-}
      - IMPRINT_PHONE=${IMPRINT_PHONE:-}
      - IMPRINT_VAT=${IMPRINT_VAT:-}
      - IMPRINT_EXTRA=${IMPRINT_EXTRA:-}
      - DATA_LOCATION=${DATA_LOCATION:-}
      - TZ=${TZ:-Europe/Vienna}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.streamchen.rule=Host(`${PUBLIC_HOST}`)"
      - "traefik.http.routers.streamchen.entrypoints=websecure"
      - "traefik.http.routers.streamchen.tls=true"
      - "traefik.http.routers.streamchen.tls.certresolver=letsencrypt"
      - "traefik.http.services.streamchen.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik"
      - "com.centurylinklabs.watchtower.enable=true"

  worker:
    image: ghcr.io/crazynudelsieb/streamchen-worker:latest
    networks:
      - streamchen_internal
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?connect_timeout=3
      - REDIS_URL=redis://redis:6379/0
      - BASE_URL=${BASE_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ICECAST_HOST=icecast
      - ICECAST_PORT=8000
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD}
      - ICECAST_BITRATE_KBPS=${ICECAST_BITRATE_KBPS:-128}
      - AUDIO_CACHE_DIR=/var/cache/streamchen
      - AUDIO_CACHE_BUDGET_BYTES=${AUDIO_CACHE_BUDGET_BYTES:-1073741824}
      - AUDIO_PREFETCH_TTL_S=${AUDIO_PREFETCH_TTL_S:-600}
      - MAX_TRACK_DURATION_S=${MAX_TRACK_DURATION_S:-900}
      - ROOM_IDLE_DAYS=${ROOM_IDLE_DAYS:-7}
      - TZ=${TZ:-Europe/Vienna}
    tmpfs:
      # The audio cache lives in RAM-backed storage with a hard size cap, so
      # "no media is retained after playback" holds even if the worker is
      # killed mid-track (concept §12, §15).
      # uid/gid must match the streamchen user in Dockerfile.worker: the tmpfs
      # hides the image's directory, so its ownership is set here or nowhere.
      - /var/cache/streamchen:size=${AUDIO_CACHE_TMPFS_SIZE:-1200m},mode=0700,uid=10001,gid=10001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      icecast:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  icecast:
    image: ghcr.io/crazynudelsieb/streamchen-icecast:latest
    networks:
      - traefik
      - streamchen_internal
    environment:
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD}
      - ICECAST_ADMIN_PASSWORD=${ICECAST_ADMIN_PASSWORD}
      - ICECAST_HOSTNAME=${PUBLIC_HOST}
      - ICECAST_MAX_CLIENTS=${ICECAST_MAX_CLIENTS:-500}
      - ICECAST_MAX_SOURCES=${ICECAST_MAX_SOURCES:-50}
      - ICECAST_BURST_SIZE=${ICECAST_BURST_SIZE:-65536}
      - TZ=${TZ:-Europe/Vienna}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Host + PathPrefix outranks the app's Host-only rule, so /stream/... goes
      # here and everything else goes to the API.
      - "traefik.http.routers.streamchen-stream.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/stream`)"
      - "traefik.http.routers.streamchen-stream.entrypoints=websecure"
      - "traefik.http.routers.streamchen-stream.tls=true"
      - "traefik.http.routers.streamchen-stream.tls.certresolver=letsencrypt"
      - "traefik.http.routers.streamchen-stream.middlewares=streamchen-stream-strip"
      - "traefik.http.middlewares.streamchen-stream-strip.stripprefix.prefixes=/stream"
      - "traefik.http.services.streamchen-stream.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik"
      - "com.centurylinklabs.watchtower.enable=true"

  db:
    image: postgres:17-alpine
    networks:
      - streamchen_internal
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ:-Europe/Vienna}
    volumes:
      # The only persistent volume in the whole deployment.
      - /var/lib/docker/volumes/streamchen/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  redis:
    image: redis:7-alpine
    networks:
      - streamchen_internal
    # No persistence: everything in Redis is a cache or a hint and may be
    # dropped at any time (concept §5).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  traefik:
    external: true
  streamchen_internal:
    driver: bridge
